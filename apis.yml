name: Tiny Comet
description: Tiny Comet is an educational games studio building history-based simulation
  RPGs for school-aged children, founded by Emily Tierney and Anca Agapi. Its first title,
  Nation Survival, is an immersive educational role-playing game on the Roblox platform.
  The studio came out of the a16z SPEEDRUN accelerator and has raised additional venture
  capital from Andreessen Horowitz and Roble Ventures. Tiny Comet is a consumer gaming and
  edtech company with no public developer or API surface at this time; this profile captures
  its identity in the API Evangelist network.
